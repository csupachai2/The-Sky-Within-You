<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onlymiru - The Sky Within You</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2canvas helps convert DOM to pristine shareable images -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary-bg: #f5f8fc;
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-color: #4a5d6e;
            --accent-color: #8da9c4;
            --header-color: #0b2545;
            --brand-color: #134074;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(180deg, #ffd1d9 0%, #d1e8ff 100%);
            color: var(--text-color);
            min-height: 100vh;
            transition: background 1.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 85vw;
            max-width: 650px;
            max-height: 650px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.65;
            z-index: 1;
            pointer-events: none;
            transition: background 1.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 40px rgba(165, 180, 203, 0.2);
        }

        button.option-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #eef2f6;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button.option-btn:hover {
            border-color: #cbdcf0;
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 16px rgba(165, 180, 203, 0.15);
            background: #fbfdff;
        }

        button.option-btn:active {
            transform: translateY(-1px) scale(0.99);
        }

        .keychain-container {
            position: relative;
            width: 290px;
            height: 360px;
            margin: 0 auto 15px;
            filter: drop-shadow(0 15px 30px rgba(135, 150, 175, 0.25));
        }

        canvas#keychain-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Cute animated pulse for saving state */
        .shimmer-anim {
            background: linear-gradient(90deg, #f3f3f3 25%, #e6e6e6 50%, #f3f3f3 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.5s infinite;
        }

        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

<audio id="bg-music" loop preload="auto">
    <source src="Untitled (1).mp3" type="audio/mpeg">
</audio>

<div class="ambient-glow" id="bg-glow"></div>

<!-- Floating control buttons -->
<div data-html2canvas-ignore="true" class="fixed top-5 right-5 bg-white/90 backdrop-blur-md border border-pink-100 rounded-full w-12 h-12 flex items-center justify-center cursor-pointer shadow-md z-50 transition-transform active:scale-95 hover:scale-105" onclick="toggleMusic()" id="music-btn" title="เปิด/ปิดดนตรีประกอบ">

        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="18" cy="16" r="3"></circle>

</div>

<!-- Elegant helper tooltip next to the music button for mobile mute switch awareness -->

    🔇 หากไม่ได้ยินเสียง อย่าลืมเปิดสวิตช์สั่น/สวิตช์ข้างเครื่องนะคะ 🌸
</div>

<div id="quiz-container" class="glass-card max-w-lg w-full rounded-[36px] p-8 text-center relative z-10 transition-all duration-1000">

        <div class="relative w-44 h-24 mb-1 flex items-center justify-center" id="logo-container">
            <img id="brand-logo-img" src="logoonly_2.png" alt="Onlymiru Logo" class="max-w-full max-h-full object-contain transition-transform hover:scale-105 duration-300" onload="onLogoLoad()" onerror="onLogoError()">
            
            <!-- Beautiful inline SVG Fallback representing Onlymiru logo if image is delayed -->

                <svg viewBox="0 0 220 100" class="w-full h-full">
                    <circle cx="48" cy="42" r="11" stroke="#d5a26a" stroke-width="3" fill="none" />
                    <path d="M12,38 C12,70 65,72 78,48 C88,20 110,18 122,46 C130,62 145,50 185,50" fill="none" stroke="#5c4d43" stroke-width="3.5" stroke-linecap="round" />
                    <text x="80" y="80" font-family="'Prompt', sans-serif" font-size="20" font-style="italic" font-weight="600" fill="#5c4d43" letter-spacing="0.5">ONLYMIRU</text>
                </svg>
            </div>
        </div>
        <p class="text-[10px] tracking-widest text-pink-400/80 -mt-1 font-bold">THE SKY WITHIN YOU</p>
    </div>
    
    <div data-html2canvas-ignore="true" class="progress-bar w-full h-2 bg-pink-50/70 rounded-full mb-6 overflow-hidden border border-pink-100/50">
        <div id="progress-fill" class="h-full bg-gradient-to-r from-pink-300 to-sky-300 w-0 transition-all duration-500 rounded-full"></div>
    </div>
    
    <div id="question-area">

    <div id="result-area" class="hidden">

        <!-- Action Buttons: Saving Result image and Restarting -->

            </button>
            <button class="w-full sm:w-auto px-6 py-3 bg-white hover:bg-slate-50 border-2 border-slate-100 text-slate-500 font-medium rounded-full shadow-sm transition-all active:scale-95 text-xs md:text-sm" onclick="location.reload()">

<div id="save-modal" data-html2canvas-ignore="true" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">

<script>
    function onLogoLoad() {
        document.getElementById('brand-logo-img').classList.remove('hidden');
        document.getElementById('logo-svg-fallback').classList.add('hidden');
    }

    function onLogoError() {
        document.getElementById('brand-logo-img').classList.add('hidden');
        document.getElementById('logo-svg-fallback').classList.remove('hidden');
    }

    const bgAudio = document.getElementById('bg-music');
    let synthAudioCtx;
    let synthOscillator;
    let synthGainNode;
    let isPlaying = false;
    let useSynthFallback = false;

    bgAudio.addEventListener('error', () => {
        console.warn("Could not load uploaded MP3 track. Ready to switch to synth sound.");
        useSynthFallback = true;
    }, true);

    // Synchronous unlocking to bypass strict iOS Safari and Android Chrome audio sandboxing policies
    function initAudioOnUserGesture() {
        try {
            // 1. Force reload and prepare standard HTML5 Audio
            if (bgAudio) {
                bgAudio.load();
            }
            
            // 2. Initialize and bind Web Audio API Context inside synchronous click thread
            if (!synthAudioCtx) {
                synthAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                synthGainNode = synthAudioCtx.createGain();
                synthGainNode.connect(synthAudioCtx.destination);
                synthGainNode.gain.setValueAtTime(0, synthAudioCtx.currentTime);
            }
            
            // 3. Force resume suspended context state (mandatory for mobile browsers in idle states)
            if (synthAudioCtx && synthAudioCtx.state === 'suspended') {
                synthAudioCtx.resume();
            }
        } catch (e) {
            console.warn("Mobile Audio Session unlock failed or deferred:", e);
        }
    }

    function toggleMusic() {
        // Unlock and verify mobile audio context synchronously
        initAudioOnUserGesture();

        const tip = document.getElementById('music-tip');

        if (!isPlaying) {
            isPlaying = true;
            document.getElementById('music-icon').style.stroke = "#ff5d8f";
            
            // Show cute mobile mute switch warning for 5 seconds
            if (tip) {
                tip.classList.remove('hidden');
                setTimeout(() => {
                    tip.classList.remove('scale-95', 'opacity-0');
                    tip.classList.add('scale-100', 'opacity-100');
                }, 50);
                
                setTimeout(() => {
                    tip.classList.remove('scale-100', 'opacity-100');
                    tip.classList.add('scale-95', 'opacity-0');
                    setTimeout(() => tip.classList.add('hidden'), 500);
                }, 5000);
            }

            bgAudio.play().then(() => {
                console.log("Playing the uploaded instrumental music file successfully.");
                useSynthFallback = false;
            }).catch(err => {
                console.warn("Audio file play blocked, falling back to synthesizer:", err);
                useSynthFallback = true;
                playSynthAmbient();
            });
        } else {
            isPlaying = false;
            document.getElementById('music-icon').style.stroke = "currentColor";
            bgAudio.pause();
            
            if (tip) {
                tip.classList.add('hidden');
                tip.style.opacity = '0';
                tip.style.transform = 'scale(0.95)';
            }

            if (synthOscillator && synthAudioCtx) {
                try {
                    synthGainNode.gain.setValueAtTime(synthGainNode.gain.value, synthAudioCtx.currentTime);
                    synthGainNode.gain.exponentialRampToValueAtTime(0.0001, synthAudioCtx.currentTime + 1);
                    setTimeout(() => { 
                        if(!isPlaying && synthOscillator) {
                            synthOscillator.stop();
                            synthOscillator = null;
                        }
                    }, 1000);
                } catch(e) {
                    console.warn("Error gracefully stopping synth engine:", e);
                }
            }
        }
    }

    function playSynthAmbient() {
        if (!synthAudioCtx) return;
        
        try {
            if (synthAudioCtx.state === 'suspended') {
                synthAudioCtx.resume();
            }
            
            if (synthOscillator) synthOscillator.stop();
            
            synthOscillator = synthAudioCtx.createOscillator();
            synthOscillator.type = 'sine';
            synthOscillator.frequency.setValueAtTime(329.63, synthAudioCtx.currentTime); // Cozy E4 chord pitch
            synthOscillator.connect(synthGainNode);
            synthOscillator.start();
            
            synthGainNode.gain.setValueAtTime(0, synthAudioCtx.currentTime);
            synthGainNode.gain.linearRampToValueAtTime(0.08, synthAudioCtx.currentTime + 2);
        } catch(e) {
            console.warn("Synth playback runtime error:", e);
        }
    }

    const questions = [

    function drawTinyStar(ctx, cx, cy, spikes, outerRadius, innerRadius, fillStyle) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;

        ctx.save();
        ctx.fillStyle = fillStyle;
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
            x = cx + Math.cos(rot) * outerRadius;
            y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    function processChromaKey(skyDrawer, resultType) {
        const canvas = document.getElementById('keychain-canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        
        img.onload = function() {
            try {
                canvas.width = img.width;
                canvas.height = img.height;
                
                // Prepare intermediate sky canvas
                const skyCanvas = document.createElement('canvas');
                skyCanvas.width = img.width;
                skyCanvas.height = img.height;
                const skyCtx = skyCanvas.getContext('2d');
                skyDrawer(skyCtx, img.width, img.height, img.width/2 + 25, img.height/2 + 55, 140);
                
                // Draw original image to grab pixel data
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = img.width;
                tempCanvas.height = img.height;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.drawImage(img, 0, 0);
                
                const keyringData = tempCtx.getImageData(0, 0, img.width, img.height);
                const skyData = skyCtx.getImageData(0, 0, img.width, img.height);
                const outputData = ctx.createImageData(img.width, img.height);
                
                const kPixels = keyringData.data;
                const sPixels = skyData.data;
                const oPixels = outputData.data;
                
                for (let i = 0; i < kPixels.length; i += 4) {
                    const r = kPixels[i];
                    const g = kPixels[i+1];
                    const b = kPixels[i+2];
                    const a = kPixels[i+3];
                    
                    // High quality green chroma threshold
                    const isGreen = (g > 110 && g > r * 1.35 && g > b * 1.35);
                    const isBlack = (r < 35 && g < 35 && b < 35);
                    
                    if (isGreen) {
                        oPixels[i] = sPixels[i];
                        oPixels[i+1] = sPixels[i+1];
                        oPixels[i+2] = sPixels[i+2];
                        oPixels[i+3] = 255;
                    } else if (isBlack) {
                        oPixels[i+3] = 0; // Transparent background
                    } else {
                        oPixels[i] = r;
                        oPixels[i+1] = g;
                        oPixels[i+2] = b;
                        oPixels[i+3] = a;
                    }
                }
                
                ctx.putImageData(outputData, 0, 0);
                document.getElementById('canvas-loader').classList.add('hidden');
                
            } catch (err) {
                console.warn("Canvas process fallback triggered:", err);
                drawVectorKeyring(canvas, ctx, skyDrawer, resultType);
            }
        };
        
        img.onerror = function() {
            drawVectorKeyring(canvas, ctx, skyDrawer, resultType);
        };

        img.crossOrigin = 'anonymous';
        img.src = 'ดาวนำทาง.jpg';
    }

            vanilla: 'linear-gradient(180deg, #ffe5ec 0%, #ffd1d9 100%)',
            blue: 'linear-gradient(180deg, #e7f5ff 0%, #d0ebff 100%)',
            stormy: 'linear-gradient(180deg, #f3f0fc 0%, #e8e3f5 100%)',
            golden: 'linear-gradient(180deg, #fff9db 0%, #ffe3e3 100%)',
            starry: 'linear-gradient(180deg, #f1f3f5 0%, #e9ecef 100%)',
            aurora: 'linear-gradient(180deg, #e6fcf5 0%, #c3fae8 100%)'
        };

        document.getElementById('bg-glow').style.background = bgGlows[finalType];
        document.body.style.background = bgColors[finalType];
    }

    function saveResultCard() {
        const targetElement = document.getElementById('quiz-container');
        
        const options = {
            backgroundColor: null,
            useCORS: true,
            allowTaint: true,
            scale: window.devicePixelRatio > 1 ? 2 : 3, // Premium quality
            logging: false
        };

        targetElement.classList.add('shimmer-anim');

        html2canvas(targetElement, options).then(canvas => {
            targetElement.classList.remove('shimmer-anim');
            const dataUrl = canvas.toDataURL('image/png');
            
            const link = document.createElement('a');
            link.download = 'onlymiru-sky-keyring.png';
            link.href = dataUrl;
            
            const modalImg = document.getElementById('generated-card-img');
            modalImg.src = dataUrl;
            
            document.getElementById('save-modal').classList.remove('hidden');
            document.getElementById('save-modal').classList.add('flex');

            try {
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (downloadErr) {
                console.warn("Direct download restricted, modal visible:", downloadErr);
            }
        }).catch(err => {
            targetElement.classList.remove('shimmer-anim');
            console.error("Error building canvas image:", err);
        });
    }

    function closeSaveModal() {
        document.getElementById('save-modal').classList.add('hidden');
        document.getElementById('save-modal').classList.remove('flex');
    }

    renderQuestion();
</script>

</body>
</html>
